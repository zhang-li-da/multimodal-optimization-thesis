<script>
"use strict";
const DATA=JSON.parse(document.getElementById('demo-data').textContent);
const $=id=>document.getElementById(id);
const h=x=>String(x==null?'—':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>x==null?'—':(x*100).toFixed(3)+'%';
const num=x=>x==null?'—':Number(x).toLocaleString('en-US');
const names={niche:'niche',niche_fixed_dev:'固定开发 · FIFO',relational_branch:'完整排序'};
const label=method=>view==='history'&&method==='niche_fixed_dev'?'固定开发 · 旧轮转':names[method];
const cls={unproductive_repeat:'无收益重复',competitive_local_improvement:'质量合格的局部改进',known_rule_reproduction:'重现已知规则',invalid_program:'无效提案',low_quality_novel_behavior:'新行为但质量不足',no_incremental_value:'无新增价值'};
let view='history',runIndex=DATA.historical.default_index,frameIndex=0,caseIndex=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}if($('play'))$('play').textContent='自动播放';}
function metric(title,value,detail){return '<div class="metric"><small>'+h(title)+'</small><b>'+h(value)+'</b><em>'+h(detail)+'</em></div>';}
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+h(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+h(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function bundle(){return view==='current'?DATA.current:DATA.historical;}
function run(){return bundle().runs[runIndex];}
function setView(name){stop();view=name;frameIndex=0;runIndex=name==='history'?DATA.historical.default_index:(name==='current'&&DATA.current?DATA.current.default_index:0);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===name)));render();}
function render(){
 if(view==='synthetic'){renderSynthetic();return;}
 if(view==='current'&&!DATA.current){$('notice').textContent='本轮搜索结果尚未导入此开发预览。历史回放与合成机制用例均可使用。';$('body').innerHTML='';return;}
 const old=view==='history';
 $('notice').innerHTML=old?'<strong>历史 v1.2 r2 · 真实日志回放。</strong> 旧版普通调度与 W 存在混杂，不能用于估计新版排序的效果。默认展示原清单顺序中首个“入池后得到续开发”的运行；全部 18 次可切换。':'<strong>v1.2.3 · 单模型探索性筛查。</strong> MiniMax M3 × 两控制器 × 八新区块，每次 8 个提案时隙。相同提案数不代表相同 token；无效提案与未入池运行均保留。';
 const b=bundle();
 $('body').innerHTML='<h2>'+(old?'把改进信用转化为实际续开发':'冻结协议下的真实搜索')+'</h2><div id="batch"></div><div class="toolbar"><label for="run-select" class="subtle">运行</label><select id="run-select" aria-label="选择归档运行">'+b.runs.map((r,i)=>'<option value="'+i+'"'+(i===runIndex?' selected':'')+'>'+h(r.id+' · '+label(r.controller))+'</option>').join('')+'</select></div><div class="toolbar"><button id="play" class="primary">自动播放</button><button id="prev" aria-label="前一提案">←</button><input id="scrubber" aria-label="提案进度" type="range" min="0" step="1"><button id="next" aria-label="后一提案">→</button><span id="step-label" class="step-label"></span></div><div id="replay"></div><details class="panel"><summary>查看本批全部运行的最终结果</summary><div id="all-runs"></div></details>';
 $('run-select').onchange=e=>{stop();runIndex=Number(e.target.value);frameIndex=0;renderFrame();};
 $('scrubber').oninput=e=>{stop();frameIndex=Number(e.target.value);renderFrame();};
 $('prev').onclick=()=>{stop();frameIndex=Math.max(0,frameIndex-1);renderFrame();};
 $('next').onclick=()=>{stop();frameIndex=Math.min(run().frames.length-1,frameIndex+1);renderFrame();};
 $('play').onclick=()=>{if(timer){stop();return;}if(frameIndex>=run().frames.length-1)frameIndex=0;$('play').textContent='暂停';timer=setInterval(()=>{if(frameIndex>=run().frames.length-1){stop();return;}frameIndex++;renderFrame();},4500);};
 if(old){$('batch').innerHTML='<div class="metrics">'+b.cells.map(c=>metric(label(c.controller),pct(c.test_gap),'历史整组平均 Test gap · '+c.runs+' 次')).join('')+metric('结果含义','未建立优势','执行链成立；关系机制独立效果未隔离')+'</div>';}
 else{const s=b.summary;const c=s.cells;$('batch').innerHTML='<div class="metrics">'+c.map(x=>metric(names[x.controller],pct(x.mean_test_gap),x.complete_runs+' / '+x.planned_runs+' 次有测试结果')).join('')+metric('完整排序 − FIFO',(s.mean_delta_pp==null?'—':s.mean_delta_pp.toFixed(3)+' pp'),'负值有利于完整排序 · '+s.complete_pairs+' 配对')+metric('有效程序 / 提案',c.reduce((a,x)=>a+x.valid_generated,0)+' / '+c.reduce((a,x)=>a+x.completed_proposals,0),'输出失败也消耗提案时隙')+'</div>';}
 $('all-runs').innerHTML=table(['运行','控制器','Test gap','tokens','状态'],b.runs.map(r=>[r.id,label(r.controller),pct(r.test_gap),num(r.tokens),r.status]));
 renderFrame();
}
function poolTable(before,after){if(!after.length&&!before.length)return '<p class="empty">本步骤 B 为空；没有可兑现的开发额度。</p>';const ids=[...new Set([...before,...after].map(b=>b.node_id))];return table(['程序','族标签','剩余额度 前 → 后','已用次数','validation gap'],ids.map(id=>{const a=after.find(x=>x.node_id===id),b=before.find(x=>x.node_id===id);return ['p'+id,(a||b).tag,(b?b.remaining:'未入池')+' → '+(a?a.remaining:'被淘汰'),a?a.attempts:'—',pct((a||b).loss)];}));}
function renderFrame(){
 const r=run(),f=r.frames[frameIndex];
 $('scrubber').max=Math.max(0,r.frames.length-1);$('scrubber').value=frameIndex;
 $('prev').disabled=frameIndex<=0;$('next').disabled=frameIndex>=r.frames.length-1;$('play').disabled=r.frames.length<2;
 if(!f){$('replay').innerHTML='<div class="panel">该计划运行无已完成提案，状态：'+h(r.status)+'</div>';$('step-label').textContent='无记录';return;}
 $('step-label').textContent=frameIndex===0?'共同初始化':'提案 '+frameIndex+' / '+(r.frames.length-1);
 const e=f.event,d=f.decision,n=e?r.nodes.find(x=>x.id===e.node_id):null;
 const remaining=f.B_after.reduce((s,b)=>s+b.remaining,0),candidate=n?(n.valid?pct(n.validation_gap):'无效'):'共同种子';
 const parent=d?r.nodes.find(x=>x.id===d.parent_id):null;
 const comparison=parent&&n?' 父代 '+pct(parent.validation_gap)+' → 子代 '+(n.valid?pct(n.validation_gap):'无效')+'。':'';
 const info=!e?'从三条共同手写规则开始。模型尚未生成新程序。':(d.development?'从 B 选择 p'+d.parent_id+' 并扣除一次开发机会。':'共享普通调度选择 '+d.action+'，父代 '+(d.parent_id==null?'无':'p'+d.parent_id)+'。')+' 本次分类：'+(cls[e.branch_classification]||e.branch_classification)+'。'+(e.branch_admitted?'候选获得有限续开发额度。':'候选没有获得新的开发额度。');
 $('replay').innerHTML='<div class="panel"><div class="panel-head"><h3>已执行的程序谱系</h3><span class="subtle">点击节点查看归档源码</span></div><div class="legend"><span><i style="background:#6a828d"></i>已评价</span><span><i style="background:#08776a"></i>B 中有额度</span><span><i style="background:#c5892e"></i>本次父代</span><span><i style="background:#b4504d"></i>无效提案</span></div><div id="lineage"></div><div class="callout">'+h(info+comparison)+'</div></div><div class="metrics">'+metric('当前最优 validation gap',pct(f.best_validation_gap),'只用于搜索，不展示逐步测试反馈')+metric('本次候选 validation gap',candidate,e?(e.parent_improved?'改善父代':'未改善父代'):'三条共同手写规则')+metric('B 可用额度',remaining,'本轮上限：容量 3，每条分支 2 次')+metric('成功改进深度',f.corrected_success_depth==null?'—':f.corrected_success_depth,'仅成功入池链；无效尝试不增长')+'</div><div class="columns"><div><div class="panel"><h3>A · 输出行为代表</h3><div>'+f.A.map(id=>'<button class="badge" data-node="'+id+'">p'+id+'</button>').join('')+'</div><p class="subtle">有限 probe 下的操作性代表，不是已知真实模式总数。</p><h3 style="margin-top:14px">M · 已执行反馈</h3><p>'+f.memory_count+' 条记录</p><p class="subtle">'+(r.kind==='historical-r2'?'历史版本仍有 W；本步骤 W 含 '+f.W.length+' 个条目。':'本轮 W 显式关闭，不参与父代或参考选择。')+'</p></div><div class="panel"><h3>B · 独立开发池</h3>'+poolTable(f.B_before,f.B_after)+'</div></div><div class="panel"><h3 id="code-title">程序源码</h3><p id="code-meta" class="subtle"></p><p id="code-intent" class="subtle"></p><pre id="code"></pre><details style="margin-top:10px"><summary class="subtle">与本次父代的源码差异</summary><pre id="code-diff"></pre></details><p class="subtle">这里只展示已归档源码；不会执行，也不会提交到模型。</p></div></div><div class="source">'+h(r.model+' · '+r.id+' · 源码版本 '+r.source_commit+' · 记录 SHA256 '+r.source_sha256)+'</div>';
 drawLineage(r,f);showCode(n?n.id:f.A[0]);
 document.querySelectorAll('#replay [data-node]').forEach(el=>el.onclick=()=>showCode(Number(el.dataset.node)));
}
function showCode(id){const n=run().nodes.find(x=>x.id===id);if(!n)return;$('code-title').textContent='p'+n.id+' · '+n.name;$('code-meta').textContent='validation gap '+pct(n.validation_gap)+' · 分配标签 '+(n.tag||'共同种子')+(n.failure?' · '+n.failure.stage+' / '+n.failure.kind:'');$('code-intent').textContent=n.intent||'';$('code-diff').textContent=n.parent_diff||'共同种子或无父代；无可展示的修改差异。';$('code').textContent=n.code||'此提案未获得可解析的程序。原始请求与响应保留在数据包中。';}
function drawLineage(r,f){const ns=r.nodes.filter(n=>f.node_ids.includes(n.id)),pos={};ns.forEach((n,i)=>pos[n.id]={x:43+i*89,y:i<3?77:(i%2?103:57)});let svg='<svg viewBox="0 0 1000 164" role="img" aria-label="截至当前提案的程序谱系"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#c0ced0"/></marker></defs>';
 ns.forEach(n=>{const p=pos[n.parent_id],c=pos[n.id];if(p)svg+='<path d="M'+p.x+','+(p.y+14)+' Q'+((p.x+c.x)/2)+',155 '+c.x+','+(c.y+14)+'" fill="none" stroke="#c0ced0" stroke-width="1.3" marker-end="url(#arrow)"/>';});
 ns.forEach(n=>{const p=pos[n.id],b=f.B_after.some(x=>x.node_id===n.id&&x.remaining>0),par=f.decision&&f.decision.parent_id===n.id,col=!n.valid?'#b4504d':par?'#c5892e':b?'#08776a':'#6a828d';svg+='<g data-node="'+n.id+'"><circle cx="'+p.x+'" cy="'+p.y+'" r="18" fill="'+col+'"/><text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" font-size="11" fill="white">p'+n.id+'</text><text x="'+p.x+'" y="'+(p.y-29)+'" text-anchor="middle" font-size="10" fill="#47636e">'+h(n.valid?pct(n.validation_gap):'无效')+'</text></g>';});$('lineage').innerHTML=svg+'</svg>';}
function renderSynthetic(){
 $('notice').innerHTML='<strong>合成控制用例 · 不是模型搜索结果。</strong> 两分支具有相同局部收益和使用次数；只调整已观测失败所属的族。页面数值来自真实 V121 控制器。没有编造任何后续改进。';
 const c=DATA.synthetic.cases[caseIndex];
 $('body').innerHTML='<h2>族证据是否真正改变下一次选择？</h2><p class="subtle">共同历史：p2 与 p3 的父代 gap 均为 12%，候选均为 11%，局部收益均为 0.01。两分支都有 2 次额度；普通调度一致。</p><div class="formula">s(b) = q(tag) + 0.25 × gain / (1 + attempts)</div><div class="synthetic-control">'+['失败记在 local_distance','失败记在 return_aware','均退回共享统计'].map((label,i)=>'<button data-case="'+i+'" class="'+(i===caseIndex?'active':'')+'">'+h(label)+'</button>').join('')+'</div><div class="columns" style="grid-template-columns:1fr 1fr">'+c.policies.map(p=>'<div class="panel"><h3>'+h(names[p.controller])+'</h3><div class="metrics" style="grid-template-columns:1fr 1fr">'+metric('实际选择','p'+p.selected_parent,'固定历史下的真实控制器输出')+metric('候选分支数',p.exposure.entries.length,'收益相同，比较族证据')+'</div>'+table(['分支 / 族','q(tag)','加权收益','总分'],p.exposure.entries.map(e=>['p'+e.node_id+' / '+e.tag,e.family_priority.toFixed(6),(.25*e.gain_term).toFixed(6),p.scores[String(e.node_id)].toFixed(6)]))+'<p class="subtle">q 是平滑的历史合格改进频率；不是经过校准的未来成功概率。</p><h3 style="margin-top:20px">随后注入一次无效提案</h3>'+poolTable(p.pool_before,p.pool_after_invalid_attempt)+'<p class="callout">消耗 1 次机会。成功改进深度没有增长，也不会补回额度。</p></div>').join('')+'</div><div class="panel"><h3>这个用例能说明什么</h3><p>两组普通调度一致，B 内选择在特定历史下确实不同；交换族证据后，完整排序改变选择。当族统计全部回退时，当前同收益用例退回相同选择。</p><p class="result-note">它只验证机制响应。真实收益仍要看多个分支能否出现、评分能否分化、不同选择后能否产生改进，并最终体现在独立测试上。</p></div>';
 document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{caseIndex=Number(b.dataset.case);renderSynthetic();});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(view!=='synthetic'&&bundle()){if(e.key==='ArrowRight'&&$('next'))$('next').click();if(e.key==='ArrowLeft'&&$('prev'))$('prev').click();}});
window.addEventListener('pagehide',stop);
render();
</script></body></html>
